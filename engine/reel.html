<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<style>
@font-face { font-family: "I"; src: url(fonts/Inter-Regular.otf); font-weight: 400; }
@font-face { font-family: "I"; src: url(fonts/Inter-Medium.otf); font-weight: 500; }
@font-face { font-family: "I"; src: url(fonts/Inter-SemiBold.otf); font-weight: 600; }
@font-face { font-family: "I"; src: url(fonts/Inter-Bold.otf); font-weight: 700; }
@font-face { font-family: "D"; src: url(fonts/InterDisplay-Light.otf); font-weight: 300; }
@font-face { font-family: "D"; src: url(fonts/InterDisplay-SemiBold.otf); font-weight: 600; }
@font-face { font-family: "D"; src: url(fonts/InterDisplay-Bold.otf); font-weight: 700; }
@font-face { font-family: "D"; src: url(fonts/InterDisplay-ExtraBold.otf); font-weight: 800; }
@font-face { font-family: "D"; src: url(fonts/InterDisplay-Black.otf); font-weight: 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
.layer { position: absolute; inset: 0; overflow: hidden; visibility: hidden; transform-origin: 50% 50%; }
.layer canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
.txt { position: absolute; inset: 0; perspective: 1400px; }
.ph { position: absolute; left: 70px; width: 940px; text-align: center; font-family: "D"; font-weight: 800; line-height: 1.04; letter-spacing: -0.02em; transform-style: preserve-3d; }
.w { display: inline-block; margin: 0 0.12em; opacity: 0; will-change: transform, opacity, filter; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#grain { position: absolute; inset: -40px; opacity: 0.07; mix-blend-mode: overlay; pointer-events: none; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.28) 100%); }
</style>
</head>
<body>
<div id="cam"></div>
<div id="flash"></div>
<canvas id="grain" width="1160" height="2000"></canvas>
<div id="vig"></div>
<img id="logo" src="assets/ms-logo.png" style="display:none" />
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script src="core.js"></script>
</body>
</html>
